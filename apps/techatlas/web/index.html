<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechAtlas — U.S. Companies by Domain</title>
<style>
  :root{
    --bg:#06070E; --surface:#0F1524; --surface-2:#141B2C; --ink:#EAEEF5;
    --muted:#93A2BC; --faint:#5E6B84; --line:#1E2740; --accent:#6E86FF; --accent-ink:#05060C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.55);
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55;
    display:flex;flex-direction:column;min-height:100dvh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;width:100%;padding:0 clamp(16px,4vw,32px)}

  header.site{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:20px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:1.08rem}
  .brand svg{width:24px;height:24px}
  .brand .ph{font-family:var(--font-mono);font-size:.56rem;color:var(--faint);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;font-weight:500}
  .header-cta{margin-left:auto}
  .btn{font:inherit;font-size:.85rem;font-weight:600;border-radius:9px;padding:8px 14px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s;display:inline-block}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  main{flex:1;display:flex;flex-direction:column}

  /* ---------- hero ---------- */
  .hero{padding:clamp(28px,6vw,64px) 0 clamp(10px,2vw,20px)}
  .eyebrow{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--muted)}
  .src-badge{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.66rem;letter-spacing:.02em;
    text-transform:none;cursor:help}
  .src-dot{width:7px;height:7px;border-radius:50%}
  h1{font-size:clamp(1.9rem,4.8vw,3.1rem);line-height:1.04;letter-spacing:-.03em;margin:.35em 0 .3em;
    text-wrap:balance;font-weight:760;max-width:20ch}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{color:var(--muted);font-size:clamp(.95rem,1.6vw,1.05rem);max-width:56ch}

  /* ---------- toolbar (view toggle + search) ---------- */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 4px;
    position:sticky;top:60px;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px)}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
  .toggle button{font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);background:none;border:0;
    padding:8px 16px;cursor:pointer}
  .toggle button.on{background:var(--accent);color:var(--accent-ink)}
  .toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toolbar .search{flex:1;min-width:180px;max-width:360px}
  .toolbar .search input{font:inherit;font-size:.9rem;width:100%;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .toolbar .search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .home-count{font-family:var(--font-mono);font-size:.74rem;color:var(--faint);white-space:nowrap}

  /* ---------- list view ---------- */
  .list{display:flex;flex-direction:column;padding:10px 0 40px}
  .litem{display:grid;grid-template-columns:44px 1.4fr 1.3fr 1fr;align-items:center;gap:14px;
    padding:11px 12px;border-radius:12px;border:1px solid transparent;transition:background .12s,border-color .12s}
  .litem:hover,.litem:focus-visible{background:var(--surface);border-color:var(--line);outline:none}
  .litem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .litem .sw{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;overflow:hidden;
    border:1px solid rgba(255,255,255,.08)}
  .litem .sw svg{width:24px;height:24px}
  .litem .sw .mono{font-weight:800;font-size:.95rem}
  .li-name{font-weight:600;font-size:.95rem}
  .li-tkr{font-family:var(--font-mono);font-size:.68rem;color:var(--faint);margin-left:6px}
  .li-dom{color:var(--muted);font-size:.82rem}
  .li-hq{color:var(--faint);font-size:.82rem;font-family:var(--font-mono);text-align:right}
  @media (max-width:720px){
    .litem{grid-template-columns:40px 1fr auto;row-gap:2px}
    .li-dom{grid-column:2/-1;font-size:.76rem}
    .li-hq{display:none}
  }

  /* ---------- rows ---------- */
  .rows{padding:8px 0 40px;display:flex;flex-direction:column;gap:clamp(18px,3vw,30px)}
  .row-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
  .row-head h2{font-size:1.05rem;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:9px}
  .row-head .dot{width:10px;height:10px;border-radius:50%;background:var(--dc,var(--accent));flex:0 0 auto}
  .row-head .n{font-family:var(--font-mono);font-size:.72rem;color:var(--faint)}

  .rail{position:relative;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  .track{display:flex;gap:14px;width:max-content;will-change:transform;
    animation:scroll-l var(--dur,70s) linear infinite}
  .rail[data-dir="rev"] .track{animation-name:scroll-r}
  .rail:hover .track,.rail:focus-within .track{animation-play-state:paused}
  @keyframes scroll-l{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes scroll-r{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  /* rows that fit the visible width don't loop */
  .rail.is-static{-webkit-mask-image:none;mask-image:none}
  .track.is-static{animation:none;width:auto}

  .card{flex:0 0 auto;width:148px;display:flex;flex-direction:column;gap:9px;padding:0;border:0;background:none;
    cursor:pointer;text-align:left}
  .tile{height:96px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}
  .card:hover .tile,.card:focus-visible .tile{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .card:focus-visible{outline:none}
  .card:focus-visible .tile{outline:2px solid var(--accent);outline-offset:3px}
  .tile svg{width:46px;height:46px}
  .tile .mono{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
  /* logo-by-ticker image layered over a monogram fallback */
  .tile .mono,.sw .mono,.big .mono{position:absolute;inset:0;display:grid;place-items:center}
  .logo-img{position:relative;z-index:1;max-width:64%;max-height:64%;object-fit:contain}
  .sw{position:relative}
  .sw .logo-img{max-width:74%;max-height:74%}
  .big{position:relative}
  .card .name{font-size:.86rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tkr{font-family:var(--font-mono);font-size:.68rem;color:var(--faint);margin-top:-4px}

  @media (prefers-reduced-motion:reduce){
    .track{animation:none;flex-wrap:nowrap}
    .rail{overflow-x:auto;scrollbar-width:thin}
  }

  .empty{padding:60px 0;color:var(--muted);font-family:var(--font-mono);font-size:.9rem}

  /* ---------- detail page (opened in a new tab) ---------- */
  .detail{max-width:820px;margin:0 auto;padding:clamp(24px,5vw,56px) 0}
  .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.74rem;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
  .back:hover{color:var(--ink)}
  .detail-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .detail .big{width:96px;height:96px;border-radius:22px;display:grid;place-items:center;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadow)}
  .detail .big svg{width:56px;height:56px}
  .detail .big .mono{font-weight:800;font-size:2rem}
  .detail h1{margin:0 0 4px;font-size:clamp(1.6rem,4vw,2.2rem)}
  .detail .tkr{font-family:var(--font-mono);font-size:.82rem;color:var(--muted)}
  .detail .hq{font-family:var(--font-mono);font-size:.74rem;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
  .detail .blurb{color:var(--muted);font-size:1rem;margin:26px 0 22px;max-width:64ch}
  .dchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .dchips span{font-size:.8rem;padding:6px 12px;border-radius:999px;color:#fff;font-weight:600}

  .section{border-top:1px solid var(--line);padding-top:22px;margin-top:26px}
  .section h3{margin:0 0 4px;font-size:1.02rem;letter-spacing:-.01em}
  .section .note{color:var(--faint);font-family:var(--font-mono);font-size:.7rem;margin:0 0 16px}
  .leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .leader{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .leader .nm{font-weight:700;font-size:.95rem}
  .leader .ti{color:var(--muted);font-size:.83rem;margin-top:1px}
  .leader .rl{display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .leader a.cite{font-family:var(--font-mono);font-size:.66rem;color:var(--accent);margin-top:8px;display:inline-block}
  .pending{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 18px;
    color:var(--muted);font-size:.9rem}
  .pending b{color:var(--ink)}
  .pending .how{margin-top:8px;font-family:var(--font-mono);font-size:.72rem;color:var(--faint)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 22px;font-size:.9rem;margin-top:22px;
    border-top:1px solid var(--line);padding-top:20px}
  .kv dt{color:var(--faint);font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
  .kv dd{margin:0;color:var(--ink)}

  footer.site{border-top:1px solid var(--line);background:var(--surface);margin-top:auto}
  .foot{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:space-between;align-items:center;padding:22px 0}
  .foot .src{font-family:var(--font-mono);font-size:.7rem;color:var(--faint)}
  .foot .links{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
  .foot .links a:hover{color:var(--ink)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="TechAtlas home">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="16" cy="16" r="3.2" fill="var(--accent)"/>
        <circle cx="16" cy="4.5" r="2.3" fill="var(--ink)"/><circle cx="26" cy="22" r="2.3" fill="var(--ink)"/>
        <circle cx="6" cy="22" r="2.3" fill="var(--ink)"/>
      </svg>
      TechAtlas <span class="ph" title="Working name — rename anytime">placeholder</span>
    </a>
    <div class="header-cta"><a class="btn" href="./">All companies</a></div>
  </div>
</header>

<main id="app" class="wrap"><!-- rendered by main.js --></main>

<footer class="site">
  <div class="wrap foot">
    <span class="src">Source of truth: MongoDB · served via <code>/api/companies</code></span>
    <div class="links"><a href="#">Sources &amp; method</a><a href="#">Privacy</a><a href="#">About</a></div>
  </div>
</footer>

<div class="sr-only" id="a11y-list" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
